<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23242A"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DB8FF"/>
      <stop offset="1" stop-color="#3F74FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#glow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="29.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <!-- track -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="10"/>
  <!-- work arc: 12 o'clock → ~8 o'clock (240°) -->
  <path d="M64 30 A34 34 0 1 1 34.56 81" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round"/>
  <!-- break arc (amber) ~ 258° → 318° -->
  <path d="M30.75 70.93 A34 34 0 0 1 41.24 38.73" fill="none" stroke="#FFA53A" stroke-width="10" stroke-linecap="round"/>
  <!-- pause -->
  <rect x="53" y="51" width="8" height="26" rx="4" fill="#F5F5F7"/>
  <rect x="67" y="51" width="8" height="26" rx="4" fill="#F5F5F7"/>
</svg>
