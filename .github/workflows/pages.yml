name: Website

# Publishes website/ to GitHub Pages (custom domain: zenmetrics.vyaca.com).
# Runs when the site changes on main, or by hand from the Actions tab.
# One-time setup: Settings → Pages → Source: "GitHub Actions", Custom domain: zenmetrics.vyaca.com
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site (without its README)
        run: |
          mkdir _site
          cp -R website/. _site/
          rm _site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
