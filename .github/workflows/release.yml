name: Release

# Push a tag like v1.0.0 (or run manually) to build installers for all three
# systems. They're attached to a DRAFT release — review it, then publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (optional, see docs/RELEASING.md): APPLE_CERTIFICATE, APPLE_ID, …
        with:
          projectPath: app
          # from the app's version, so manual runs and tag pushes both give "v0.1.0"-style releases
          tagName: v__VERSION__
          releaseName: "ZenMetrics v__VERSION__"
          releaseBody: "Unofficial — not made by or affiliated with TeamLogger. See the README for setup."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
