name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux — tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Tauri + GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: UI — install, type-check, build
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Core — unit tests
        working-directory: app/src-tauri
        env:
          TLB_ALLOW_CLICKS: "0"   # belt and braces: tests never click anything real
        run: cargo test --locked
      - name: Linux GTK app — syntax check
        run: python3 -m py_compile *.py

  build:
    name: ${{ matrix.os }} — compile
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: UI build
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Core — compile and unit tests
        working-directory: app/src-tauri
        env:
          TLB_ALLOW_CLICKS: "0"
        run: cargo test --locked
